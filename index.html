<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Jeu de Piste GPS - Test Mobile</title>

  <!-- Meta PWA & Mobile -->
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Plugin Leaflet-Rotate (Rotation tactile deux doigts & Bearing API) -->
  <script src="https://unpkg.com/leaflet-rotate@0.5.3/dist/leaflet-rotate.js"></script>

  <!-- Feuille de style personnalisée -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="h-full w-full overflow-hidden select-none bg-slate-900 font-sans text-slate-800 antialiased">

  <!-- Carte Leaflet (Occupe 100% de l'écran en arrière-plan) -->
  <div id="map" class="absolute inset-0 z-0 h-full w-full"></div>

  <!-- Mini-Badge GPS Discret (Haut Gauche) -->
  <header class="safe-top absolute top-3 left-3 z-10 pointer-events-none">
    <div class="inline-flex items-center space-x-1.5 bg-slate-900/85 backdrop-blur-md px-2.5 py-1 rounded-full shadow-md text-white text-[11px] font-medium pointer-events-auto border border-white/10">
      <span id="status-dot" class="w-2 h-2 rounded-full bg-amber-400"></span>
      <span id="header-status">GPS Inactif</span>
    </div>
  </header>

  <!-- Notification d'erreur compacte -->
  <div id="error-banner" class="absolute top-12 left-3 right-3 z-30 max-w-sm mx-auto hidden transition-all duration-300">
    <div class="bg-rose-50/95 backdrop-blur-md border border-rose-200 text-rose-900 px-3 py-2 rounded-xl shadow-lg flex items-center justify-between text-xs">
      <div class="flex items-center space-x-2 min-w-0 pr-1">
        <span class="text-rose-500 font-bold shrink-0">⚠️</span>
        <p class="truncate" id="error-msg">Signal GPS indisponible.</p>
      </div>
      <button id="btn-close-error" class="text-rose-400 hover:text-rose-700 font-bold text-sm px-1">&times;</button>
    </div>
  </div>

  <!-- Boutons d'Action Flottants (Droite, accessibles au pouce) -->
  <div class="absolute bottom-32 right-3 z-10 flex flex-col space-y-2.5 items-end">
    <!-- Suivre le cap / Boussole (3 modes : Inactif -> Boussole stabilisée -> Cap de marche GPS) -->
    <button id="btn-track-heading" class="w-11 h-11 bg-white/95 backdrop-blur-md text-slate-700 rounded-full shadow-lg border border-white/60 flex items-center justify-center active:scale-90 transition-all relative" title="Mode d'orientation (Boussole / Cap GPS)">
      <svg id="compass-btn-icon" class="w-5 h-5 text-indigo-600 transition-transform duration-300" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/>
      </svg>
      <span id="heading-mode-badge" class="absolute -bottom-1 -right-1 text-[8px] font-black px-1 rounded-full bg-slate-200 text-slate-700 hidden shadow-sm"></span>
    </button>

    <!-- Recentrer sur le joueur -->
    <button id="btn-recenter" class="w-11 h-11 bg-white/95 backdrop-blur-md text-slate-700 rounded-full shadow-lg border border-white/60 flex items-center justify-center active:scale-90 transition-all hidden" title="Recentrer">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0013 3.06V1h-2v2.06A8.994 8.994 0 003.06 11H1v2h2.06A8.994 8.994 0 0011 20.94V23h2v-2.06A8.994 8.994 0 0020.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
      </svg>
    </button>

    <!-- Bouton Test 20m discret (pour tester sans marcher) -->
    <button id="btn-simulate-poi" class="w-11 h-11 bg-white/95 backdrop-blur-md text-indigo-600 rounded-full shadow-lg border border-white/60 flex items-center justify-center active:scale-90 transition-all text-base" title="Simuler arrivée 20m">
      🧪
    </button>
  </div>

  <!-- Panneau HUD Mobile-First Ultra-Compact (Bas de l'écran) -->
  <main class="safe-bottom absolute bottom-3 left-3 right-3 z-10 pointer-events-none">
    <div class="mx-auto max-w-sm bg-white/95 backdrop-blur-md rounded-2xl shadow-xl border border-white/60 p-3 pointer-events-auto">
      
      <!-- Cible + Statut + Distance (1 seule ligne dense) -->
      <div class="flex items-center justify-between pb-2.5">
        <div class="min-w-0 pr-2">
          <div class="flex items-center space-x-1.5">
            <span class="w-2 h-2 rounded-full bg-indigo-600 shrink-0"></span>
            <h2 id="stage-title" class="text-sm font-bold text-slate-800 truncate">Stade Bollaert-Delelis</h2>
          </div>
          <div class="flex items-center space-x-1.5 text-[11px] text-slate-500 mt-0.5">
            <span>±<b id="metric-accuracy">--</b>m</span>
            <span>•</span>
            <span id="badge-validation" class="font-bold text-slate-500">En attente</span>
          </div>
        </div>

        <!-- Distance géante -->
        <div class="text-right shrink-0">
          <div class="flex items-baseline justify-end space-x-0.5">
            <span id="metric-distance" class="text-2xl font-black text-slate-900 tracking-tight leading-none">--</span>
            <span id="metric-distance-unit" class="text-xs font-bold text-slate-500">m</span>
          </div>
          <span class="text-[9px] text-slate-400 block mt-0.5">Rayon : ≤ 30m</span>
        </div>
      </div>

      <!-- Bouton GPS Unique (Large, ergonomique) -->
      <button id="btn-toggle-gps" class="w-full py-2.5 px-4 bg-indigo-600 active:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md transition-all flex items-center justify-center space-x-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        <span id="btn-label">Activer la géolocalisation</span>
      </button>

    </div>
  </main>

  <!-- Script applicatif -->
  <script src="app.js"></script>
</body>
</html>
