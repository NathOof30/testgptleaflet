<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Jeu de Piste GPS - Prototype MVP</title>

  <!-- Meta PWA & Mobile -->
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Tailwind CSS (Play CDN pour prototype sans build) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Feuille de style personnalisée -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="h-full w-full overflow-hidden select-none bg-slate-900 font-sans text-slate-800 antialiased">

  <!-- Conteneur Carte Leaflet -->
  <div id="map" class="absolute inset-0 z-0 h-full w-full"></div>

  <!-- En-tête / Barre supérieure -->
  <header class="safe-top absolute top-0 left-0 right-0 z-10 p-3 pointer-events-none">
    <div class="mx-auto max-w-md bg-white/90 backdrop-blur-md px-4 py-2.5 rounded-2xl shadow-lg border border-white/40 flex items-center justify-between pointer-events-auto">
      <div class="flex items-center space-x-2.5">
        <span class="relative flex h-3 w-3">
          <span id="ping-indicator" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75 hidden"></span>
          <span id="status-dot" class="relative inline-flex rounded-full h-3 w-3 bg-amber-500"></span>
        </span>
        <span class="text-xs font-semibold tracking-wide uppercase text-slate-700" id="header-status">
          GPS Inactif
        </span>
      </div>
      <div class="text-[11px] font-medium text-slate-500 bg-slate-100 px-2.5 py-1 rounded-full">
        Cible : Lens
      </div>
    </div>
  </header>

  <!-- Notification d'erreur flottante -->
  <div id="error-banner" class="absolute top-16 left-4 right-4 z-20 max-w-md mx-auto hidden transition-all duration-300">
    <div class="bg-rose-50 border border-rose-200 text-rose-800 px-4 py-3 rounded-2xl shadow-lg flex items-start space-x-3 text-sm">
      <svg class="w-5 h-5 text-rose-500 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
      </svg>
      <div class="flex-1">
        <p class="font-semibold text-rose-900" id="error-title">Erreur de géolocalisation</p>
        <p class="text-xs text-rose-700 mt-0.5" id="error-msg">Impossible d'accéder au signal GPS.</p>
      </div>
      <button id="btn-close-error" class="text-rose-400 hover:text-rose-700 text-base leading-none">&times;</button>
    </div>
  </div>

  <!-- Bouton de recentrage (visible uniquement une fois le GPS actif) -->
  <button id="btn-recenter" class="absolute bottom-56 right-4 z-10 w-11 h-11 bg-white/90 backdrop-blur-md text-slate-700 rounded-full shadow-lg border border-white/50 flex items-center justify-center active:scale-95 transition-all hidden hover:bg-white" title="Centrer sur ma position" aria-label="Centrer sur ma position">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0013 3.06V1h-2v2.06A8.994 8.994 0 003.06 11H1v2h2.06A8.994 8.994 0 0011 20.94V23h2v-2.06A8.994 8.994 0 0020.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
    </svg>
  </button>

  <!-- Panneau d'Information & Action (Overlay Bas Mobile-First) -->
  <main class="safe-bottom absolute bottom-0 left-0 right-0 z-10 p-4 pointer-events-none">
    <div class="mx-auto max-w-md bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/60 p-4 sm:p-5 pointer-events-auto transition-all duration-300">
      
      <!-- Cible & Badge de validation -->
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <div>
          <span class="text-[11px] uppercase tracking-wider font-bold text-indigo-600 block">Étape en cours</span>
          <h2 class="text-base font-bold text-slate-800">Stade Bollaert-Delelis</h2>
        </div>
        <div id="badge-validation" class="px-3 py-1 rounded-full text-xs font-bold bg-slate-100 text-slate-500 border border-slate-200 transition-colors duration-300">
          En attente
        </div>
      </div>

      <!-- Métriques en temps réel -->
      <div class="grid grid-cols-2 gap-3 my-3">
        <!-- Distance -->
        <div class="bg-slate-50/80 rounded-2xl p-3 border border-slate-100 flex flex-col items-center justify-center text-center">
          <span class="text-[11px] font-medium text-slate-400 uppercase tracking-wide">Distance restante</span>
          <div class="flex items-baseline space-x-1 mt-0.5">
            <span id="metric-distance" class="text-2xl font-black text-slate-800">--</span>
            <span id="metric-distance-unit" class="text-xs font-semibold text-slate-500">m</span>
          </div>
          <span class="text-[10px] text-slate-400 mt-0.5">Zone cible : ≤ 30 m</span>
        </div>

        <!-- Précision GPS -->
        <div class="bg-slate-50/80 rounded-2xl p-3 border border-slate-100 flex flex-col items-center justify-center text-center">
          <span class="text-[11px] font-medium text-slate-400 uppercase tracking-wide">Précision GPS</span>
          <div class="flex items-baseline space-x-1 mt-0.5">
            <span class="text-xs font-semibold text-slate-500">±</span>
            <span id="metric-accuracy" class="text-2xl font-black text-slate-800">--</span>
            <span class="text-xs font-semibold text-slate-500">m</span>
          </div>
          <span id="accuracy-level" class="text-[10px] text-slate-400 mt-0.5">Non connecté</span>
        </div>
      </div>

      <!-- Bouton d'action principal -->
      <button id="btn-toggle-gps" class="w-full mt-1 py-3.5 px-4 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-semibold rounded-2xl shadow-lg shadow-indigo-500/25 transition-all flex items-center justify-center space-x-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        <span id="btn-label">Activer la géolocalisation</span>
      </button>

      <!-- Outil de test / Démonstration en intérieur (Jury & Dev) -->
      <div class="mt-2.5 flex items-center justify-between pt-2 border-t border-slate-100">
        <span class="text-[10px] text-slate-400">Test en intérieur :</span>
        <button id="btn-simulate-poi" type="button" class="text-[11px] font-semibold text-indigo-600 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 px-2.5 py-1 rounded-lg transition-colors flex items-center space-x-1">
          <span>🧪</span>
          <span id="simulate-label">Simuler arrivée (20m)</span>
        </button>
      </div>

    </div>
  </main>

  <!-- Script applicatif -->
  <script src="app.js"></script>
</body>
</html>
